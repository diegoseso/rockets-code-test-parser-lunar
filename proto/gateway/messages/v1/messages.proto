syntax = "proto3";

package gateway.messages.v1;

option go_package = "github.com/diegoseso/rockets-code-test-parser-lunar/proto/gen/proto/go/gateway/messages/v1";

import "google/api/annotations.proto";

service MessagesAPIService {
  rpc Process(ProcessRequest) returns (ProcessResponse) {
    option (google.api.http) = {
      post: "/messages"
      body: "*"
    };
  }
}

message ProcessRequest {
  Metadata metadata = 1;
  Message message = 2;
}

// Message is a wrapper that can hold any of the rocket event types.
// The actual type is determined by metadata.message_type field.
message Message {
  optional string type = 1;           // RocketLaunched
  optional int32 launch_speed = 2;    // RocketLaunched (camelCase for JSON)
  optional string mission = 3;        // RocketLaunched
  optional int32 by = 4;              // RocketSpeedIncreased / RocketSpeedDecreased
  optional string reason = 5;         // RocketExploded
  optional string new_mission = 6;     // RocketMissionChanged (camelCase for JSON)
}

message ProcessResponse {}

// metadata according to README.md definition
message Metadata {
  string channel = 1;
  int64 message_number = 2;
  string message_time = 3;
  string message_type = 4;
}
